[project]
name = "security-review-agent"
version = "0.1.0"
description = "AI-powered security code review agent using Google ADK. Detects vulnerabilities in GitHub PRs and rewrites code securely."
requires-python = ">=3.9"

dependencies = [
    "google-adk>=1.0.0,<2.0.0",
    "google-cloud-bigquery>=3.31.0,<4.0.0",
    "google-cloud-storage>=2.18.0,<3.0.0",
    "flask>=3.0.0,<4.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "PyGithub>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_review_agent"]
